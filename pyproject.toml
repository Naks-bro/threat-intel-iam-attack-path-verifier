[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-iam"
version = "0.1.0"
description = "Local fixture slice for human-approved IAM rule matching and bounded attack-path verification."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fyp_iam = ["engine1/artifacts/*.json", "engine1/foundry/pins/*.json", "engine1/foundry/corpus/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
markers = ["postgres: requires a migrated PostgreSQL database in FYP_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [".cursor/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fyp_iam"]
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
