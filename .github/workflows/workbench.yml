name: workbench

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Unit tests
        run: python -m pytest -m "not postgres" -o addopts=
      - name: Mypy
        run: python -m mypy src

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fyp
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: fyp_iam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fyp -d fyp_iam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FYP_DATABASE_URL: postgresql+psycopg://fyp:ci-only@localhost:5432/fyp_iam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Migrate
        run: python -m alembic upgrade head
      - name: PostgreSQL tests
        run: python -m pytest -m postgres -o addopts=
